    <text x="72" y="170" font-family="'Inter','Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="24" font-weight="500" fill="#1f2328" fill-opacity="0.82">Senior AI Engineer — building AI software &amp; solutions</text>
    <text x="72" y="208" font-family="'Courier Prime',ui-monospace,Menlo,monospace" font-size="15.5" font-weight="700" letter-spacing="1" fill="#656d76">PYTHON · PYTORCH · YOLO · DEEPSTREAM · TENSORRT · LLM AGENTS · MCP · RAG</text>
