      <circle cx="1188" cy="228" r="5" opacity="0.13"/>
      <circle cx="1188" cy="228" r="2" opacity="0.75"/>
      <circle cx="1066" cy="188" r="6" opacity="0.13"/>
      <circle cx="1066" cy="188" r="2.2" opacity="0.85"/>
    </g>

