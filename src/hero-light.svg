      <path d="M-132 0H132 M0 -132V132" fill="none" stroke="#656d76" opacity="0.40" stroke-dasharray="2 7"/>
      <path d="M16 0H128" fill="none" stroke="#0053fd" stroke-width="1.5" opacity="0.60" transform="rotate(-42)"/>
