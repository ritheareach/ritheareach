<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Ritheareach Chan — AI Engineer · AI software &amp; solutions · Phnom Penh, Cambodia">
  <defs>
